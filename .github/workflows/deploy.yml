name: LifeLog CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Só um deploy por vez — evita concorrência entre workflows duplicados
concurrency:
  group: lifelog-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      statuses: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # história completa p/ git diff-tree listar arquivos na notificação

    # ── Validação ──────────────────────────────────────────────
    - name: Validate project
      run: |
        echo "🔍 Verificando estrutura do projeto..."
        if [ ! -f "package.json" ]; then
          echo "❌ package.json não encontrado"
          exit 1
        fi
        NAME=$(grep '"name"' package.json | sed 's/.*"name": "//;s/".*//')
        echo "✅ Projeto: $NAME"

        VERSION=$(grep '"version"' package.json | sed 's/.*"version": "//;s/".*//')
        if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "❌ Versão inválida: $VERSION (deve ser semver major.minor.patch)"
          exit 1
        fi
        echo "✅ Versão: v$VERSION"

    # ── Setup ─────────────────────────────────────────────────
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install pnpm
      run: |
        npm install -g pnpm@10
        mkdir -p /tmp/pnpm-store
        pnpm config set store-dir /tmp/pnpm-store --global
        echo "PNPM_HOME=/tmp/pnpm-home" >> $GITHUB_ENV

    # ── Cache ──────────────────────────────────────────────────
    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: /tmp/pnpm-store
        key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-

    - name: Cache Playwright browsers
      id: cache-playwright
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-

    # ── Dependencies ───────────────────────────────────────────
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install Playwright browsers
      if: steps.cache-playwright.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium

    # ── Quality Gates ──────────────────────────────────────────
    - name: SCA — Auditoria de dependências (pnpm audit)
      # Fase 5.1: bloqueia build se biblioteca tiver CVE conhecida
      continue-on-error: true
      run: pnpm audit || echo "⚠️ pnpm audit encontrou vulnerabilidades (não bloqueia deploy)"

    - name: SAST — Lint estático com eslint-plugin-security
      # Fase 5.2: varredura passiva (ReDoS, injeção, más práticas)
      continue-on-error: true
      run: pnpm lint || echo "⚠️ Lint encontrou warnings (não bloqueia deploy)"

    - name: PT/EN Sync check
      run: python3 scripts/check-lang-sync.py
    - name: Tag vocabulary check (Opção C)
      run: python3 scripts/check-tags.py --strict

    - name: Astro type check
      continue-on-error: true
      run: pnpm astro check

    - name: Build Astro
      run: pnpm build

    - name: SEO bilíngue — hreflang e assets do head (guardiao)
      run: |
        echo "🔎 Verificando hreflang e assets do <head> no dist..."
        python3 scripts/check-alternates.py --dist dist
        echo "✅ hreflang sem links quebrados e assets do head presentes"
      # Astro build catches MDX syntax errors, broken imports, missing components

    # ── Self-heal: ocultos-data síncrono ────────────────────────────
    # Se o build regenerou api/ocultos-data.mjs diferente do HEAD (drift de
    # qualquer origem), commita a cura em main com [skip ci] — o deploy desta
    # run já sai com o data fresco; o repo nunca fica stale pro painel.
    - name: Self-heal ocultos-data
      if: github.ref_name == 'main' && github.event_name != 'pull_request'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if ! git diff --quiet -- api/ocultos-data.mjs; then
          git add api/ocultos-data.mjs
          git commit -m "chore(ocultos): sync ocultos-data [skip ci]"
          git push origin main || echo "⚠️ push falhou (main mudou) — próximo release/cura sincroniza"
          echo "✅ ocultos-data re-sincronizado (commit de cura)"
        else
          echo "✅ ocultos-data em sincronia — nada a fazer"
        fi
    - name: Cleanup post-publish
      run: |
        bash scripts/cleanup-post.sh --dist
        echo "✅ Cleanup concluído — previews e debug files removidos"

    - name: Start preview server
      run: |
        npx astro preview --port 4321 --host 127.0.0.1 &
        sleep 3
        for i in $(seq 1 10); do
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4321/ 2>/dev/null || echo "000")
          if [ "$CODE" = "200" ]; then
            echo "✅ Preview server ready on :4321"
            break
          fi
          echo "Waiting for preview... ($i)"
          sleep 2
        done
        if [ "$CODE" != "200" ]; then
          echo "❌ Preview server didn't start"
          exit 1
        fi
        # Readiness nao e só a home: o E2E navega para /en/, post e asset. Se alguma
        # dessas ainda nao serve, os testes comecam contra servidor meio-vivo e o erro
        # vira net::ERR_ABORTED (o falso-negativo que mascaramos por meses).
        for probe in /en/ /404.html /manifest.json; do
          C=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:4321$probe" || echo 000)
          echo "probe $probe -> $C"
          case "$C" in
            200|404) ;;
            *) echo "❌ preview nao pronto em $probe ($C)"; exit 1 ;;
          esac
        done
        echo "✅ preview pronto em todas as rotas criticas"

    - name: Run unit tests
      run: pnpm exec vitest run --reporter=verbose

    - name: E2E ratchet — auditoria da dívida conhecida
      # 14/09/2026 (PR #51) — o primeiro run honesto (8 failed / 409 passed) expôs dívida
      # que existia ANTES do gate. Ela mora declarada em e2e/known-failures.json e fica
      # fora do gate por titulo. Este step trava o pipeline se qualquer 'expiry' passar:
      # a dívida vence, nao evapora. Teste NOVO continua barrado de verdade.
      run: node scripts/e2e-ratchet.mjs audit

    - name: Run E2E tests
      # 13/09/2026 — o step antigo tinha `continue-on-error: true` + `|| true`: o E2E
      # podia falhar inteiro e o pipeline seguia verde (falso-verde; passou `success`
      # com 12 testes falhando). Agora e gate de verdade — sem swallow de exit code em
      # hipotese alguma. A deuda pre-gate e controlada pelo ratchet declarado do passo
      # acima (--grep-invert por titulo), visivel e com prazo, nunca por mascara.
      # workers=1: o preview e um unico processo e 2 chromiums em paralelo estouravam o
      # timeout de navegacao sob carga — estabilidade primeiro, velocidade depois.
      env:
        PLAYWRIGHT_TEST_URL: http://127.0.0.1:4321
      run: |
        RE=$(node scripts/e2e-ratchet.mjs grep-invert)
        N=$(node scripts/e2e-ratchet.mjs count)
        if [ -n "$RE" ]; then
          echo "gate honesto: suite inteiro, exceto $N teste(s) de dívida declarada (e2e/known-failures.json)"
          pnpm exec playwright test --config e2e/playwright.config.ts --reporter=list --workers=1 --grep-invert "$RE"
        else
          pnpm exec playwright test --config e2e/playwright.config.ts --reporter=list --workers=1
        fi

    # Log dedicado: quando o E2E falha, o relatorio do Playwright (traces + screenshots +
    # error-context) vira artefato do run, com timestamp no nome — prova de recorrencia.
    - name: Upload E2E report (evidencia)
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          playwright-report/
          test-results/
        retention-days: 14
        if-no-files-found: ignore

    # ── Deploy ─────────────────────────────────────────────────
    - name: Deploy to Vercel (Production)
      if: github.ref_name == 'main' && github.event_name != 'pull_request'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        npx vercel@latest --prod --token="$VERCEL_TOKEN" --yes

    # ── Health Check ──────────────────────────────────────────
    - name: Health Check
      if: github.ref_name == 'main' && github.event_name != 'pull_request'
      run: |
        sleep 15
        BASE="https://lifelog-sepia.vercel.app"
        FAIL=0
        TOTAL_OK=0
        TOTAL_FAIL=0

        check_url() {
          local url="$1"
          local label="${2:-$url}"
          local code
          code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$url" 2>/dev/null || echo "000")
          if [ "$code" = "200" ]; then
            echo "  ✅ $label → $code"
            TOTAL_OK=$((TOTAL_OK + 1))
          else
            echo "  ❌ $label → $code"
            TOTAL_FAIL=$((TOTAL_FAIL + 1))
            FAIL=1
          fi
        }

        echo "═══ LifeLog Health Check ═══"
        echo ""

        # ── Páginas estáticas ──────────────────────────────────────
        echo "── Routes statiques ──"
        # Homepage com retry
        for i in $(seq 1 3); do
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/" 2>/dev/null || echo "000")
          [ "$CODE" = "200" ] && break
          [ "$i" -lt 3 ] && sleep 3
        done
        [ "$CODE" = "200" ] && echo "  ✅ / → $CODE" && TOTAL_OK=$((TOTAL_OK + 1)) \
                       || { echo "  ❌ / → $CODE"; FAIL=1; TOTAL_FAIL=$((TOTAL_FAIL + 1)); }

        check_url "/rss.xml"     "/rss.xml"
        check_url "/sitemap.xml" "/sitemap.xml"
        check_url "/arquivo/"    "/arquivo/"
        check_url "/sobre/"      "/sobre/"
        check_url "/en/"         "/en/"
        check_url "/en/archive/" "/en/archive/"
        check_url "/en/about/"   "/en/about/"
        echo ""

        # ── Todas as rotas de post ─────────────────────────────────
        echo "── Post routes ──"
        for mdx in src/content/posts/*.mdx; do
          SLUG=$(basename "$mdx" .mdx)

          # Pula drafts e ocultos (hidden: true nao gera pagina -> 404)
          if head -30 "$mdx" | grep -qE '^draft:\s*true|^hidden:\s*true'; then
            echo "  ⏭️  /post/$SLUG/ — draft/oculto, pulando"
            continue
          fi

          check_url "/post/$SLUG/" "/post/$SLUG/"
        done
        echo ""


        echo "── EN post routes ──"
        for mdx_en in src/content/posts/en/*.mdx; do
          SLUG_EN=$(basename "$mdx_en" .mdx)
          if head -30 "$mdx_en" | grep -qE '^draft:\s*true|^hidden:\s*true'; then
            echo "  ⏭️  /en/post/$SLUG_EN/ — draft/oculto, pulando"
            continue
          fi
          check_url "/en/post/$SLUG_EN/" "/en/post/$SLUG_EN/"
        done
        echo ""
        # ── Resultado ──────────────────────────────────────────────
        echo "═══ Resumo: $TOTAL_OK ✅ | $TOTAL_FAIL ❌ ═══"
        [ "$FAIL" = "0" ] && echo "✅ All health checks passed" || exit 1

    # ── Notifications ──────────────────────────────────────────
    - name: Notify Telegram Success
      if: github.ref_name == 'main' && github.event_name != 'pull_request' && success()
      run: |
        COMMIT_SHA=$(git rev-parse --short HEAD)
        COMMIT_SUBJECT=$(git log -1 --pretty=%s | sed 's/[*_`]/\\&/g')
        FILE_COUNT=$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l)
        CHANGED=$(git diff-tree --no-commit-id --name-status -r HEAD | head -15 | sed 's/^/• /' | tr '\t' ' ' | sed 's/[*_`]/\\&/g')
        TEXT="✅ *LifeLog CI*

        📦 *Status:* Sucesso
        🔗 *URL:* https://lifelog-sepia.vercel.app
        📝 *Commit:* \`$COMMIT_SHA\` — $COMMIT_SUBJECT
        📄 *Alterações ($FILE_COUNT arquivos):*
        $CHANGED"
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          --data-urlencode "text=$TEXT" \
          --data-urlencode "parse_mode=Markdown"

    - name: Notify Telegram Failure
      if: github.ref_name == 'main' && github.event_name != 'pull_request' && failure()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=❌ *LifeLog CI Falhou*%0A%0A📝 *Commit:* \`$(git rev-parse --short HEAD)\`%0A🔍 *Log:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          -d "parse_mode=Markdown"
