name: 🔒 Security Scan

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1"  # Every Monday 06:00 UTC

jobs:
  gitleaks:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  bandit-opengrep:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      # 11/11/2026 — runner self-hosted: `actions/setup-python@v5` falha com
      # "The version '3.11' with architecture 'x64' was not found for cachyos rolling".
      # O CachyOS e rolling e nao tem build do 3.11; o host ja tem python3.14 +
      # bandit + opengrep em ~/.local/bin. Usar o que existe em vez de baixar.
      # `curl -o /usr/local/bin/` tambem falharia (root-only). Sem sudo no CI.
      - name: Ferramentas de scan disponiveis no host
        run: |
          echo "python:  $(python3 --version 2>&1)"
          echo "bandit:  $(command -v bandit || echo AUSENTE)"
          echo "opengrep: $(command -v opengrep || echo AUSENTE)"
          # 15/11/2026 — DOIS defeitos no fallback antigo, medidos no run
          # 43703582905 (job 132779766272):
          #  (1) `pip install --user bandit` morre com
          #      externally-managed-environment (PEP 668 do CachyOS) e reprovava
          #      o job em 1s sem rodar scan nenhum;
          #  (2) ~/.local/bin nao estava no PATH do runner, entao as duas
          #      ferramentas JA INSTALADAS no host apareciam como AUSENTE.
          # A cura de (2) foi Environment=PATH na unit do runner (raiz).
          # Aqui: detecta uv/pipx e so instala se realmente faltar.
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v bandit >/dev/null; then
            if command -v uv >/dev/null; then
              uv tool install bandit
            elif command -v pipx >/dev/null; then
              pipx install bandit
            else
              python3 -m venv /tmp/bandit-venv && /tmp/bandit-venv/bin/pip -q install bandit
              ln -sf /tmp/bandit-venv/bin/bandit "$HOME/.local/bin/bandit"
            fi
          fi
          if ! command -v opengrep >/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -sL https://github.com/opengrep/opengrep/releases/download/v1.26.0/opengrep_manylinux_x86 \
              -o "$HOME/.local/bin/opengrep"
            chmod +x "$HOME/.local/bin/opengrep"
          fi
          echo "--- final ---"
          echo "bandit:  $(command -v bandit || echo AUSENTE)"
          echo "opengrep: $(command -v opengrep || echo AUSENTE)"
      - name: Bandit scan (se houver Python)
        run: |
          if find . -name "*.py" -not -path "*/node_modules/*" | grep -q .; then
            bandit -q -r . -x "*/tests/*,*/node_modules/*" --severity-level medium || true
          else
            echo "Sem arquivos Python — pulando bandit"
          fi
      - name: Opengrep scan (regras custom)
        run: |
          if [ -f .security/opengrep-rules.yml ]; then
            opengrep --config .security/opengrep-rules.yml . || true
          else
            echo "Sem regras custom (.security/opengrep-rules.yml) — pulando opengrep"
          fi
